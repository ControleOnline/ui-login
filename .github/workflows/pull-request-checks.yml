name: Pull Request Checks

on:
  pull_request:
  push:
    branches:
      - task-64

jobs:
  create-account-errors:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run create-account error mapping test
        run: npm run test:create-account-error-message
